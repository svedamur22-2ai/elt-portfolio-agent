# Cross-source project mapping (Section 6).
#
# This is the single source of truth for joining Jira projects to financial
# projects. Nothing downstream is allowed to guess a mapping — if a project
# is missing here, it is surfaced as UNKNOWN, never silently matched by name.
#
# organization_id / portfolio_id give Mem0 memory a stable scope that survives
# project renames (see Section 11).
#
# project_status is enterprise portfolio metadata (lifecycle state as tracked
# by the PPM/portfolio register) — it does not come from Jira or Finance, so
# it lives here alongside the other ownership fields the join needs and that
# neither source system provides.

organization_id: "org-northwind"
portfolio_id: "portfolio-elt-2026"

projects:
